services:
  db:
    container_name: ani-db
    image: pgautoupgrade/pgautoupgrade:18-trixie
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  api:
    container_name: ani-api
    image: ghcr.io/bolinocroustibat/artificial-non-intelligence-backend/api:${TAG:-latest}
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - POSTGRES_DB=${POSTGRES_DB}
      - SENTRY_DSN=${SENTRY_DSN}
      - ORIGINS=${ORIGINS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  data-analysis:
    container_name: ani-data
    image: ghcr.io/bolinocroustibat/artificial-non-intelligence-backend/data-analysis:${TAG:-latest}
    build:
      context: ./data-analysis
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DATA_PORT:-8501}:8501"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - POSTGRES_DB=${POSTGRES_DB}
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped

volumes:
  postgres_data:
